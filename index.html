<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To Do List II</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="todo-container">
    <header>
      <h1>My To-Do List</h1>
    </header>

    <section class="task-section">
      <ul id="task-list">
        <li class="task-item">
          <label>
            <input type="checkbox" class="task-checkbox">
            <span class="task-text">Review Code Platoon DOM lectures</span>
          </label>
        </li>
        <li class="task-item">
          <label>
            <input type="checkbox" class="task-checkbox">
            <span class="task-text">Build HTML & CSS to-do layout</span>
          </label>
        </li>
        <li class="task-item">
          <label>
            <input type="checkbox" class="task-checkbox">
            <span class="task-text">Connect JavaScript event handlers</span>
          </label>
        </li>
      </ul>
    </section>
  </main>
</body>
</html>
